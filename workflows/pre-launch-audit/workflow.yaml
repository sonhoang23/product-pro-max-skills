name: pre-launch-audit
version: 0.1.0
description: Audit whether an implemented MVP is coherent, operationally ready and runtime verified for its intended launch scope.
steps:
  - id: audit-flow
    skill: ux-flow
    on_pass: review-architecture
    on_warn: review-architecture
    on_fail: stop
  - id: review-architecture
    skill: architecture-plan
    on_pass: check-engineering
    on_warn: check-engineering
    on_fail: stop
  - id: check-engineering
    skill: engineering-readiness
    on_pass: verify-runtime
    on_warn: verify-runtime
    on_fail: stop
  - id: verify-runtime
    skill: runtime-verification
    on_pass: launch-gate
    on_warn: launch-gate
    on_fail: stop
  - id: launch-gate
    skill: launch-readiness
    on_pass: complete
    on_warn: complete
    on_fail: stop
