name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate_repo.py
      - name: Check installer
        run: python scripts/install.py --target .tmp-skills --all --dry-run
      - name: Verify Design System token and source tests
        run: |
          python -m unittest discover -s tests -p 'test_design_system*.py' -v
          python scripts/verify_design_system.py --check-tokens
          python scripts/export_brand_assets.py --check
          python scripts/export_design_tokens.py --surface diagram --theme light --output tests/fixtures/design-system/snapshots/light.css --check
      - name: Verify diagram Atlas and layout
        run: |
          python scripts/verify-diagram-atlas.py
          python scripts/verify-diagram-layout.py
      - name: Verify self-contained diagrams
        run: |
          python .agents/skills/diagram-design-vi/scripts/self_check.py \
            specs/002-skill-manifest-registry/spec-diagram/skill-metadata-relations.html \
            specs/003-product-pro-max-design-system/spec-diagram/presentation-boundary.html \
            specs/003-product-pro-max-design-system/plan-diagram/token-resolution.html \
            tests/fixtures/design-system/specimen-light.html \
            tests/fixtures/design-system/specimen-dark.html

  browser:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Chromium QA dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Capture offline browser QA
        run: python scripts/verify_design_browser.py --output .tmp-spec003-browser --promoted
      - name: Archive exact browser screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec003-browser-qa
          path: .tmp-spec003-browser/
          if-no-files-found: error
          include-hidden-files: true

  native_zoom:
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native zoom QA dependencies
        run: |
          python -m pip install playwright==1.57.0 python-xlib
          python -m playwright install chromium
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Verify native browser 200% Ctrl+Plus zoom
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/verify_design_native_zoom.py --output .tmp-spec003-native-zoom
      - name: Archive native zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec003-native-zoom-qa
          path: .tmp-spec003-native-zoom/
          if-no-files-found: warn
          include-hidden-files: true
