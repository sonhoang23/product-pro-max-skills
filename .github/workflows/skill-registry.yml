name: Skill Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install -r requirements-registry.txt
      - name: Run read-only registry release verification
        run: python scripts/verify_skill_registry_release.py
