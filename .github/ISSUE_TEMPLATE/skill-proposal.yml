name: Skill proposal
description: Propose a new Product Pro Max skill
title: "[Skill]: "
labels: ["skill-proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete product decision or task does this solve?
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: Target user and trigger
      description: Who needs this and when should an agent invoke it?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why existing skills are insufficient
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and output
      description: What evidence should the skill consume or produce?
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Quality gate and stop conditions
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation
      description: How can we tell this skill improves decisions or execution?
    validations:
      required: true
